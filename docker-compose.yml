
version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend 
    ports:
      - "80:80" 
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend  
    ports:
      - "5000:5000" 
    environment:
      - MONGO_URI=mongodb+srv://theok:1F5ckutbhF2WGdSN@cluster0.gqhrb.mongodb.net/gameDB?retryWrites=true&w=majority
      - JWT_SECRET=your_jwt_secret
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
